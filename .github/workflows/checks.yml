name: Checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # The three checks AGENTS.md requires. Cloudflare Workers Builds does the
      # deploying, so this gates what reaches main rather than shipping it.
      - name: Type check
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        run: bunx oxlint src

      - name: Build
        run: bun run build
