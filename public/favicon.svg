<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Doan">
  <!--
    The Doan mark, study II.02 `Vòng`, still. The live drawing is
    src/components/doan-mark.tsx; the square's 45 degree rest turn is baked in
    here as a transform, because there is no stylesheet to carry it.

    Hexes are literal because an icon file cannot read the site's tokens. They
    are the ink and paper colours and their dark-mode inversion: if those move
    in src/styles.css, move these. The light values are presentation
    attributes and the dark values are a media query, which outranks them, so
    a renderer that ignores <style> still gets a correct light icon instead of
    a black mark on a black tile.

    Nothing in here may contain two hyphens in a row. This is XML, so that
    ends the comment early and the whole file fails to parse.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .tile { fill: #e9e6df }
      .fill { fill: #151412 }
      .line { stroke: #151412 }
    }
  </style>
  <rect class="tile" width="24" height="24" fill="#1b1a17"/>
  <path class="fill" d="M5.6 3.4A4.1 4.1 0 0 1 5.6 11.6Z" fill="#faf9f6"/>
  <circle class="line" cx="16.5" cy="7.5" r="3.6" fill="none" stroke="#faf9f6" stroke-width="1.8"/>
  <polygon class="fill" points="7.5,12.9 3.5,20.1 11.5,20.1" fill="#faf9f6"/>
  <rect class="line" x="13.9" y="13.9" width="5.2" height="5.2" fill="none" stroke="#faf9f6" stroke-width="1.75" transform="rotate(45 16.5 16.5)"/>
</svg>
